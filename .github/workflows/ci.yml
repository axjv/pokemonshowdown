name: iOS CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-packages:
    name: swift test (${{ matrix.package }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        package: [PSProtocol, PSNet, PSData, PSTeams]
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: swift test
        run: |
          set -o pipefail
          swift test --package-path Packages/${{ matrix.package }} 2>&1 | tee swift-test.log
      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -E "error:|Fatal error|Compiling failed" swift-test.log \
            | sort -u | head -60 | sed "s/^/::error::/"

  ios-app:
    name: iOS app build + test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Use newest Xcode in the image
        # Current XcodeGen writes a pbxproj dialect the image's default
        # (older) Xcode cannot read; run everything on the newest one.
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"
          echo "::notice::using $X"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          xcodegen generate
          find . -maxdepth 2 -name "*.xcodeproj" | sed "s/^/::notice::generated at /"
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project PokemonShowdown.xcodeproj -scheme PokemonShowdown \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug build 2>&1 | tee build.log
      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project PokemonShowdown.xcodeproj -scheme PokemonShowdown \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug test 2>&1 | tee test.log
      - name: Surface errors as annotations
        if: failure()
        run: |
          for f in build.log test.log; do
            [ -f "$f" ] || continue
            grep -E "error:|Fatal error" "$f" | sort -u | head -60 | sed "s/^/::error::/"
          done
