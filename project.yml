name: PokemonShowdown
options:
  createIntermediateGroups: true
  bundleIdPrefix: dev.avien
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# Local SPM packages (XcodeGen links these into the generated project)
packages:
  PSProtocol:
    path: Packages/PSProtocol
  PSNet:
    path: Packages/PSNet
  PSData:
    path: Packages/PSData
  PSTeams:
    path: Packages/PSTeams

targets:
  PokemonShowdown:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
    dependencies:
      - package: PSProtocol
        product: PSProtocol
      - package: PSNet
        product: PSNet
      - package: PSData
        product: PSData
      - package: PSTeams
        product: PSTeams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.avien.pokemonshowdown
        PRODUCT_NAME: PokemonShowdown
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Pokemon Showdown"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations~iphone: UIInterfaceOrientationPortrait,UIInterfaceOrientationLandscapeLeft,UIInterfaceOrientationLandscapeRight

  PokemonShowdownTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Tests
    dependencies:
      - target: PokemonShowdown
      - package: PSProtocol
        product: PSProtocol
      - package: PSNet
        product: PSNet
      - package: PSTeams
        product: PSTeams
      - package: PSData
        product: PSData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.avien.pokemonshowdown.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PokemonShowdown:
    build:
      targets:
        PokemonShowdown: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PokemonShowdownTests
