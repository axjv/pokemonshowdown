appId: dev.avien.pokemonshowdown
productName: PokemonShowdown
copyright: Personal project — not affiliated with Game Freak, Nintendo, or Smogon

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

asar: true
# Unsigned personal build: no code-signing identity is configured, and
# electron-builder must not fail when it cannot find one.
forceCodeSigning: false

win:
  executableName: PokemonShowdown
  target:
    - portable
    - nsis

portable:
  artifactName: ${productName}-${version}-windows-portable.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  artifactName: ${productName}-${version}-setup.${ext}
